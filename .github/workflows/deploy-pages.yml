name: Deploy to GitHub Pages

# Only the default branch deploys. GitHub restricts the github-pages
# environment to it, so a run on any other branch is rejected before its first
# step with "Branch ... is not allowed to deploy to github-pages due to
# environment protection rules" — a guaranteed red run on every push to a
# working branch. The site has one deployment; main is what it serves.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not on already.
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
