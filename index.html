<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מנהל/ת בעידן ה-AI | שאלון מוכנות אישי – רפאל</title>
<meta name="description" content="שאלון מוכנות אישי למנהלים ברפאל — Human Leadership ו-AI Coworker.">
<meta name="theme-color" content="#00002c">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo-ngg.png" type="image/png">
<link rel="preload" href="assets/fonts/assistant-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-ground="navy">

<main id="app">
  <!-- מסך פתיחה -->
  <section class="screen" id="screen-intro" aria-labelledby="intro-title">
    <div class="motif" aria-hidden="true">
      <div class="comet comet--wide" style="--x:11%; --y:14%; --rot:51.7deg; --dx:84.60; --dy:107.12;">
        <span class="comet-trail"></span><span class="comet-dot"></span>
      </div>
      <div class="comet comet--bottom" style="--x:7%; --y:26px; --rot:130.2deg; --dx:-88.10; --dy:104.26;">
        <span class="comet-trail"></span><span class="comet-dot"></span>
      </div>
      <div class="comet comet--bottom" style="--x:93%; --y:26px; --rot:51.7deg; --dx:84.60; --dy:107.12;">
        <span class="comet-trail"></span><span class="comet-dot"></span>
      </div>
    </div>
    <div class="wrap"></div>
  </section>

  <!-- שאלות השאלון -->
  <section class="screen" id="screen-quiz" hidden aria-labelledby="question-text">
    <div class="motif" aria-hidden="true">
      <div class="comet comet--bottom" style="--x:90%; --y:56px; --rot:148.5deg; --dx:-116.39; --dy:71.32;">
        <span class="comet-trail"></span><span class="comet-dot"></span>
      </div>
    </div>
    <div class="wrap"></div>
  </section>

  <!-- מסך התוצאות -->
  <section class="screen results" id="screen-results" hidden tabindex="-1">
    <div class="motif" aria-hidden="true">
      <div class="comet" style="--x:8%; --y:6%; --rot:36.7deg; --dx:109.44; --dy:81.58;">
        <span class="comet-trail"></span><span class="comet-dot"></span>
      </div>
    </div>
    <div class="wrap wrap--wide"></div>
  </section>

  <noscript>
    <div class="wrap" style="padding-block:64px">
      <p class="t-title">השאלון דורש JavaScript פעיל בדפדפן.</p>
    </div>
  </noscript>
</main>

<footer class="brandbar">
  <img class="brandbar__ngg" src="assets/img/logo-ngg.png" alt="NGG" width="71" height="84">
  <img class="brandbar__rafael" id="rafael-mark" src="assets/img/logo-rafael-white.png" alt="רפאל" width="170" height="42">
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/export.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
